<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree Explorer</title>
<style>
:root { --ink:#0f1626; --ink2:#18223a; --brass:#d8c690; --brass2:#b39a5c; --paper:#efe6cf; --dim:#8a93ad; --sage:#9fbf9f; }
* { box-sizing:border-box; } html,body { margin:0; height:100%; color:var(--paper); background:#0b111d; font-family:Georgia,'Times New Roman',serif; } [hidden]{display:none !important}
    /* the family tree view (pedigree.js): a person on the left, their ancestors to the right; drag, zoom, tap */
    .ped { position:fixed; inset:0; z-index:14; display:none; flex-direction:column; background:radial-gradient(120% 90% at 30% 0%, #22304d 0%, #141d31 55%, #0b111d 100%); }
    .ped.on { display:flex; } 
    .pbar { display:flex; align-items:center; gap:12px; padding:16px 24px 10px; flex-wrap:wrap; position:relative; z-index:6; }
    .pbtn, .pseg button, .pzoom button { font:inherit; font-size:15px; color:var(--brass); background:rgba(13,20,36,.8); border:1px solid rgba(216,198,144,.35); cursor:pointer; }
    .pbtn { border-radius:999px; padding:8px 18px; min-height:42px; } .pbtn:hover, .pseg button:hover, .pzoom button:hover { border-color:var(--brass); }
    .pseg { display:inline-flex; align-items:center; border:1px solid rgba(216,198,144,.35); border-radius:999px; overflow:hidden; background:rgba(13,20,36,.8); }
    .pseg button { border:0; border-left:1px solid rgba(216,198,144,.2); padding:8px 16px; min-height:40px; background:transparent; } .pseg button:first-of-type { border-left:0; }
    .pseg button.on { background:var(--brass); color:var(--ink); font-weight:600; } .pseg em { font-style:normal; color:var(--dim); font-size:13px; padding:0 10px 0 16px; }
    .psearch { position:relative; flex:1 1 260px; max-width:520px; } .psearch > span { position:absolute; left:15px; top:50%; transform:translateY(-52%); color:var(--brass); font-size:18px; pointer-events:none; }
    .psearch input { width:100%; font:inherit; font-size:16px; color:var(--paper); background:rgba(13,20,36,.88); border:1px solid rgba(216,198,144,.38); border-radius:999px; padding:9px 18px 9px 40px; min-height:42px; outline:none; -webkit-appearance:none; appearance:none; }
    .psearch input:focus { border-color:var(--brass); box-shadow:0 0 0 3px rgba(216,198,144,.15); } .psearch input::placeholder { color:var(--dim); }
    .psearch ul { position:absolute; top:calc(100% + 6px); left:0; right:0; list-style:none; margin:0; padding:6px; background:#0f1829; border:1px solid rgba(216,198,144,.35); border-radius:14px; max-height:min(60vh, 520px); overflow:auto; box-shadow:0 18px 40px rgba(0,0,0,.55); }
    .psearch li { padding:9px 12px; border-radius:9px; cursor:pointer; } .psearch li.on, .psearch li:hover { background:rgba(216,198,144,.13); }
    .psearch li b { display:block; color:var(--paper); font-weight:600; font-size:16px; } .psearch li small { color:var(--dim); font-size:13px; } .psearch li.none { color:var(--dim); font-style:italic; cursor:default; }
    .ptrail { display:flex; align-items:center; gap:2px; overflow-x:auto; white-space:nowrap; padding:0 24px 8px; min-height:34px; scrollbar-width:none; font-size:14px; color:var(--dim); position:relative; z-index:5; }
    .ptrail::-webkit-scrollbar { display:none; } .ptrail em { font-style:italic; } .ptrail span { opacity:.45; padding:0 2px; }
    .ptrail button { font:inherit; font-size:15px; color:#cfc6ae; background:none; border:0; padding:5px 8px; border-radius:8px; cursor:pointer; }
    .ptrail button small { color:var(--dim); font-size:12px; margin-left:5px; } .ptrail button:hover { background:rgba(216,198,144,.1); } .ptrail button.here { color:var(--brass); font-weight:600; }
    .pbody { position:relative; flex:1; min-height:0; }
    .pstage { position:absolute; inset:0; overflow:hidden; touch-action:none; cursor:grab; } .pstage.grabbing { cursor:grabbing; }
    .pworld { position:absolute; left:0; top:0; transform-origin:0 0; transition:transform .55s cubic-bezier(.2,.8,.2,1); } .pworld.drag { transition:none; }
    .pworld svg { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
    .pworld path { fill:none; stroke:rgba(216,198,144,.3); stroke-width:1.6; transition:stroke .3s; } .pworld path.dash { stroke-dasharray:4 5; stroke:rgba(216,198,144,.18); }
    .pworld path.on { stroke:#ffe9a8; stroke-width:2.6; }
    .pc { position:absolute; display:flex; align-items:center; gap:10px; padding:8px 12px 8px 14px; border-radius:12px; background:rgba(15,22,38,.94); border:1px solid rgba(216,198,144,.22);
      box-shadow:inset 4px 0 0 var(--lc, #d8c690), 0 4px 16px rgba(0,0,0,.35); cursor:pointer; user-select:none; -webkit-user-select:none;
      transition:border-color .2s, box-shadow .2s; animation:pcIn .5s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--d) * 55ms); }
    @keyframes pcIn { from { opacity:0; transform:translateX(var(--dx, 0px)); } to { opacity:1; transform:none; } }
    .pc:hover { border-color:rgba(216,198,144,.7); } .pc.root { background:rgba(36,44,62,.96); border-color:rgba(216,198,144,.6); }
    .pc.sel { border-color:#ffe9a8; box-shadow:inset 4px 0 0 var(--lc, #d8c690), 0 0 0 3px rgba(255,233,168,.35), 0 6px 20px rgba(0,0,0,.45); }
    .ped.keys .pc.cur { outline:3px solid #ffe9a8; outline-offset:3px; }   /* only once the arrows are in use */
    .pc i { flex:none; width:42px; height:42px; border-radius:50%; background:#26334f center 22%/cover; display:grid; place-items:center; font-style:normal; font-weight:600; font-size:14px; color:#cfc6ae; border:1.5px solid var(--lc, #d8c690); }
    .pc .pt { min-width:0; flex:1; } .pc b { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-weight:600; font-size:15px; line-height:1.15; color:var(--paper); }
    .pc small { display:block; color:var(--dim); font-size:13px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pc.more { padding-right:38px; }
    .pc.empty { background:rgba(15,22,38,.35); border-style:dashed; box-shadow:none; cursor:default; } .pc.empty b { color:var(--dim); font-weight:500; font-style:italic; }
    .pmore, .pback { position:absolute; top:50%; transform:translateY(-50%); width:30px; height:30px; border-radius:50%; border:1px solid rgba(216,198,144,.45); background:#16213a; color:var(--brass); font-size:17px; line-height:1; cursor:pointer; display:grid; place-items:center; padding:0; }
    .pmore { right:5px; } .pback { left:-40px; } .pmore:hover, .pback:hover { background:var(--brass); color:var(--ink); }
    .plegend { position:absolute; left:20px; bottom:30px; display:flex; flex-wrap:wrap; gap:6px 16px; max-width:min(70vw, 760px); font-size:13px; color:#cfc6ae; background:rgba(11,17,29,.7); padding:8px 12px; border-radius:10px; z-index:2; pointer-events:none; }
    .plegend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
    .pzoom { position:absolute; right:18px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:3; transition:right .4s cubic-bezier(.2,.8,.2,1); }
    .pzoom button { width:44px; height:44px; border-radius:50%; font-size:20px; display:grid; place-items:center; padding:0; } .pzoom #pGen { display:none; font-size:15px; }
    .ppanel { position:absolute; top:0; right:0; bottom:0; width:min(430px, 92vw); background:rgba(13,19,34,.97); border-left:1px solid rgba(216,198,144,.3); box-shadow:-20px 0 40px rgba(0,0,0,.4);
      transform:translateX(105%); transition:transform .42s cubic-bezier(.2,.8,.2,1); overflow-y:auto; overscroll-behavior:contain; padding:22px 24px 40px; z-index:5; }
    .ped.panel .ppanel { transform:none; } .ped.panel .pkeys { display:none; } .ped.panel .pzoom { right:calc(min(430px, 92vw) + 18px); }
    .ppanel .px { position:sticky; top:0; float:right; margin:-6px -8px 0 8px; width:40px; height:40px; border-radius:50%; font-size:24px; line-height:1; color:var(--brass); background:rgba(13,20,36,.9); border:1px solid rgba(216,198,144,.35); cursor:pointer; z-index:2; }
    .pphoto { margin:0 0 14px; } .pimg { background:#0b111d; border-radius:12px; overflow:hidden; display:grid; place-items:center; height:260px; }
    .pimg img { max-width:100%; max-height:100%; object-fit:contain; filter:sepia(.12); } .pphoto figcaption { color:#b9b2a0; font-size:14px; font-style:italic; line-height:1.4; margin-top:8px; }
    .pnav { display:flex; align-items:center; justify-content:center; gap:14px; margin-top:6px; color:var(--dim); font-size:13px; }
    .pnav button { width:36px; height:36px; border-radius:50%; font-size:18px; color:var(--brass); background:rgba(13,20,36,.8); border:1px solid rgba(216,198,144,.35); cursor:pointer; }
    .ppanel .kick { color:var(--brass); font-size:12.5px; letter-spacing:.22em; text-transform:uppercase; margin-top:4px; }
    .ppanel .pvia { color:#ddd5bf; font-style:italic; font-size:15px; line-height:1.35; margin:3px 0 0; }
    .ppanel h2 { font-size:30px; line-height:1.08; font-weight:600; margin:6px 0 10px; }
    .prole { display:inline-block; padding:3px 12px; border:1px solid rgba(159,191,159,.5); border-radius:999px; color:var(--sage); font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:10px; }
    .pmeta { color:#ddd5bf; font-size:16px; line-height:1.5; } .pmeta div { margin:4px 0; display:grid; grid-template-columns:70px 1fr; } .pmeta span { color:var(--dim); font-style:italic; }
    .pstory { margin-top:14px; font-size:17px; line-height:1.55; color:#ddd5bf; }
    .psvc { margin-top:14px; padding:12px 14px; border-left:3px solid var(--brass); background:rgba(216,198,144,.06); border-radius:0 10px 10px 0; }
    .psvc b { display:block; color:var(--brass); font-size:15px; } .psvc span { display:block; color:#cfc6ae; font-size:14px; margin:3px 0 6px; } .psvc p { font-size:15px; line-height:1.5; color:#ddd5bf; }
    .ppanel h3 { font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--brass); margin:22px 0 10px; font-weight:600; }
    .pchips { display:grid; gap:8px; } .pchip { display:flex; align-items:center; gap:10px; text-align:left; font:inherit; width:100%; padding:8px 12px; border-radius:12px; color:var(--paper); background:rgba(13,20,36,.85); border:1px solid rgba(216,198,144,.25); cursor:pointer; }
    .pchip:hover { border-color:var(--brass); } .pchip i { flex:none; width:36px; height:36px; border-radius:50%; background:#26334f center 22%/cover; display:grid; place-items:center; font-style:normal; font-size:13px; color:#cfc6ae; }
    .pchip b { display:block; font-weight:600; font-size:15px; line-height:1.2; } .pchip small { color:var(--dim); font-size:13px; }
    .pnone { margin-top:10px; color:var(--dim); font-style:italic; font-size:15px; } .psibs { color:#cfc6ae; font-size:15px; line-height:1.55; } .psibs small { color:var(--dim); }
    .pcta { margin-top:22px; width:100%; font:inherit; font-size:16px; font-weight:600; color:var(--ink); background:var(--brass); border:0; border-radius:999px; padding:13px 18px; cursor:pointer; }
    .pkeys { position:absolute; left:0; right:0; bottom:4px; text-align:center; color:var(--dim); font-size:13px; opacity:.75; pointer-events:none; z-index:2; }
    .menu .opts.four { grid-template-columns:1fr 1fr; }
    @media (pointer: coarse) { .pkeys { display:none; } }
    @media (max-width:900px), (orientation:portrait) {
      .pbar { padding:12px 12px 8px; gap:8px; } .pbtn { padding:8px 14px; font-size:15px; } .pseg button { padding:8px 12px; font-size:15px; }
      .psearch { order:5; flex:1 1 100%; max-width:none; } .pgens { display:none; } .pzoom #pGen { display:grid; }
      .ptrail { padding:0 8px 6px; } .plegend { display:none; } .pkeys { display:none; }
      .pc { gap:9px; padding:7px 9px 7px 11px; border-radius:11px; } .pc i { width:36px; height:36px; font-size:13px; } .pc b { font-size:14.5px; } .pc small { font-size:12.5px; } .pc.more { padding-right:34px; }
      .pmore { width:26px; height:26px; right:3px; font-size:15px; }
      .pzoom { right:12px; bottom:12px; flex-direction:row; } .pzoom button { width:44px; height:44px; } .pzoom #pIn, .pzoom #pOut { display:none; }   /* pinch instead */
      .ppanel { top:auto; left:0; width:auto; height:62%; border-left:0; border-top:1px solid rgba(216,198,144,.35); border-radius:18px 18px 0 0; box-shadow:0 -16px 40px rgba(0,0,0,.5); transform:translateY(105%); padding:18px 18px 36px; }
      .ped.panel .pzoom { display:none; } .pimg { height:200px; } .ppanel h2 { font-size:26px; }
    }

</style></head><body>
  <div class="ped" id="ped" aria-label="The family tree">
    <div class="pbar">
      <button class="pbtn" id="pMenu" hidden>Menu</button>
      <div class="pseg" id="pSide"><button data-s="h">Alex</button><button data-s="c">Sam</button></div>
      <div class="psearch"><span aria-hidden="true">⌕</span><input id="pFind" type="search" placeholder="Find anyone: a name, a year or a place" autocomplete="off" autocapitalize="words" enterkeyhint="search" aria-label="Find anyone in the tree"><ul id="pHits" hidden></ul></div>
      <div class="pseg pgens" id="pGens"><em>Generations</em><button data-g="3">3</button><button data-g="4">4</button><button data-g="5">5</button><button data-g="6">6</button></div>
      <button class="pbtn" id="pHome">⌂ Start</button>
    </div>
    <nav class="ptrail" id="pTrail" aria-label="The line back"></nav>
    <div class="pbody">
      <div class="pstage" id="pStage"><div class="pworld" id="pWorld"></div></div>
      <div class="plegend" id="pLegend"></div>
      <div class="pzoom"><button id="pIn" aria-label="Zoom in">+</button><button id="pOut" aria-label="Zoom out">−</button><button id="pFit" aria-label="Fit to the screen">⤢</button><button id="pGen" aria-label="Generations shown">4</button></div>
      <aside class="ppanel" id="pPanel" aria-live="polite"></aside>
      <p class="pkeys">◀ ▶ ▲ ▼ move · OK opens a card · OK again starts the tree there</p>
    </div>
  </div>
<script src="tree.js"></script><script src="app.js"></script><script src="pedigree.js"></script>
<script>window.FAMILYPED.open('h');</script>
</body></html>
